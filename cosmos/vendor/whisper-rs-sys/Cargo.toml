[package]
name = "whisper-rs-sys"
version = "0.15.0"
edition = "2021"
rust-version = "1.88.0"
description = "Rust bindings for externally verified whisper.cpp sources"
license = "Unlicense"
repository = "https://codeberg.org/tazz4843/whisper-rs"
links = "whisper"

[features]
coreml = []
cuda = []
hipblas = []
openblas = []
metal = []
vulkan = []
force-debug = []
openmp = []
intel-sycl = []

[build-dependencies]
cmake = "0.1"
bindgen = "0.72"
cfg-if = "1"
fs_extra = "1.3"
semver = "1.0"

[workspace]
