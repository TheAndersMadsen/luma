[package]
name = "cosmos-rtc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# Only isolated acceptance fixtures may replace the process-wide SDK transport.
test-loopback-tls = [
    "dep:async-trait",
    "dep:livekit-net",
    "dep:reqwest",
    "dep:rustls",
    "dep:tokio-tungstenite",
    "dep:url",
    "futures-util/sink",
]

[dependencies]
# Published source matches revision 2d9f01ab1e933a86a8a5c53805ee29ee58b9be1b.
livekit = { version = "=0.8.4", features = ["rustls-tls-webpki-roots"] }
livekit-token = "=0.1.1"
futures-util.workspace = true
uuid.workspace = true
tokio.workspace = true
thiserror.workspace = true
async-trait = { version = "0.1", optional = true }
livekit-net = { version = "=0.1.2", optional = true, default-features = false }
reqwest = { version = "0.12.9", optional = true, default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
url = { version = "2", optional = true }

[dev-dependencies]
serde_json = "1"
