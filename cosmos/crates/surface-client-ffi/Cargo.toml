[package]
name = "cosmos-surface-client-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmos-surface-client = { path = "../surface-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
cosmos-rtc = { path = "../rtc" }
jni = "0.21.1"
