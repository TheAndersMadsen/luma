[package]
name = "cosmos-surface-client-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmos-surface-client = { path = "../surface-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
cosmos-rtc = { path = "../rtc" }
jni = "0.21.1"

[build-dependencies]
# Android links libwebrtc statically; the Java classes in libwebrtc.jar need
# their JNI natives kept and exported from this library. The vendored helper
# only reads the separately verified archive.
webrtc-sys-build = "0.3.19"
