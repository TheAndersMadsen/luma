// THE ONE DIVERGENCE THE OTHER TREE WON, out of the nine that changed bytes:
// pin/runtime/core/proto/humane/aibus/aibus.proto declares
// `humane.aibus.RunState.agent_to_runs (1)` as `map<string, Runs>`, which is
// what the field name says and what the sibling `Runs` message exists to hold.
// `bytes` was this file's placeholder for a type the reconstruction could not
// resolve, it carried 28 bare bytes fields to the pin copy's 4, and a
// placeholder loses to a declaration that fits the surrounding types.
//
// What the placeholder cost: a map encodes as repeated length-delimited MapEntry
// submessages, so a singular `bytes` field decodes without error and keeps only
// the LAST entry's raw bytes, discarding every other agent's runs in silence.
// Nothing observed that, because the shipped device never sends
// `StreamingUnderstandRequest.initial_run_state` and Cosmos accepts and skips it
// (cosmos/crates/cosmos/src/assistant/bidi.rs), so the field has never carried a
// live map. That is why this was a safe Cosmos-side change to land: the decode
// it corrects has no traffic behind it today, and it stops being safe the moment
// a client seeds a run.
message RunState {
  map<string, Runs> agent_to_runs = 1;
}

message Runs {
  repeated Run runs = 1;
}

