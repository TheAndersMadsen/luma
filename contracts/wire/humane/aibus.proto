// Stock declares these five rpcs lowerCamel (TestAutomationServiceGrpc and
// WebSearchServiceGrpc pass "createNewCalendarEvents" / "search" to
// generateFullMethodName). The rpc name is the route, so keep the case.
service TestAutomationService {
  rpc createNewCalendarEvents (CreateNewCalendarEventsRequest) returns (CreateNewCalendarEventsResponse);
  rpc deleteAllCalendarEvents (google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc getCalendarEvents (GetCalendarEventsRequest) returns (GetCalendarEventsResponse);
  rpc initializeCalendar (google.protobuf.Empty) returns (InitializedCalendarResponse);
}

service WebSearchService {
  rpc search (SearchRequest) returns (SearchResponse);
}
