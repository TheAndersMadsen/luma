// Feature-flag distribution for the Carry-compatible edge.
//
// Independently authored interface reconstruction. Field numbers match the
// observed wire contract so a stock device deserializes the response; the
// flag values themselves are this project's own configuration.
syntax = "proto3";

package humane.featureflags;

// The device asks for its assigned flags; identity comes from the
// authenticated channel, so the request carries no fields.
message DeviceFeatureFlagRequest {}

message DeviceFeatureFlagResponse {
  repeated FeatureFlagAssignment assignment = 1;
}

// One typed flag assignment. Exactly one of the `val` arm is meaningful; the
// arm selected is the flag's declared type.
message FeatureFlagAssignment {
  string flag_id = 1;
  oneof val {
    string val_str = 2;
    float val_float = 3;
    int64 val_int = 4;
    bool val_bool = 5;
  }
  string flag_name = 6;
}

service FeatureFlagsService {
  rpc GetFlags(DeviceFeatureFlagRequest) returns (DeviceFeatureFlagResponse);
}
