<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="title desc">
  <title id="title">Private by design</title>
  <desc id="desc">A padlock whose shackle closes.</desc>
  <style>
    .shackle { animation: lock 1.1s cubic-bezier(.2,.7,.2,1) .4s both; }
    @keyframes lock { from { transform: translateY(-7px); } to { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="96" height="96" rx="24" fill="#0a0b0b" stroke="#1f2121"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="26" y="44" width="44" height="32" rx="8" stroke="#f5f5f5"/>
    <path class="shackle" d="M35 44 V34 a13 13 0 0 1 26 0 V44" stroke="#00ffe0"/>
    <circle cx="48" cy="58" r="3.5" fill="#00ffe0" stroke="none"/>
    <path d="M48 60 V67" stroke="#00ffe0"/>
  </g>
</svg>
