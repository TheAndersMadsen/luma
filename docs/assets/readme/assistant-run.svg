<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="title desc">
  <title id="title">One question, one bounded run</title>
  <desc id="desc">Each request from the Pin gets one run with an absolute 70-second deadline. A router in code sends a fixed phrasing or an already-grounded step, such as asking the Pin for its location before local weather, down the direct route with no model call. Everything else takes the model loop: a model step of at most 20 seconds, a server tool such as search, maps, music, or your MCP servers, whose result is untrusted data, then another model step. One tool call is lane A1, more than one is A2, and the stock ceiling of eight actions per request applies. Either way the answer leaves before the deadline.</desc>
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="390"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2121"/><stop offset="1" stop-color="#131414"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#004d43"/><stop offset="1" stop-color="#0f1514"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#727679"/></marker>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
    .t { fill: #f5f5f5; font-size: 15px; font-weight: 600; }
    .s { fill: #a9abab; font-size: 12px; }
    .n { fill: #a9abab; font-size: 11.5px; }
    .k { fill: #727679; font-size: 11px; letter-spacing: 2px; }
    .l { fill: #00ffe0; font-size: 11px; letter-spacing: .4px; }
    .m { fill: #727679; font-size: 10.5px; }
    .wire { fill: none; stroke: #005e59; stroke-width: 2; }
    .thin { fill: none; stroke: #3d4141; stroke-width: 1.5; stroke-dasharray: 3 5; }
    .flow { fill: none; stroke: #00ffe0; stroke-width: 2; stroke-dasharray: 4 14; animation: flow 1.1s linear infinite; }
    .dot { fill: #d2fff8; animation: move 3s cubic-bezier(.45,0,.55,1) infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes move { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    .req { fill: #d2fff8; animation: d1 8s linear infinite; }
    .rsp { fill: #d2fff8; animation: a1 8s linear infinite; }
    @keyframes d1 { 0% { offset-distance: 0%; opacity: 0; } 3% { opacity: 1; } 36% { opacity: 1; } 40%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes a1 { 0%, 44% { offset-distance: 0%; opacity: 0; } 47% { opacity: 1; } 94% { opacity: 1; } 98%, 100% { offset-distance: 100%; opacity: 0; } }
    .drain { transform-box: fill-box; transform-origin: left center; animation: drain 8s linear infinite; }
    @keyframes drain { 0% { transform: scaleX(0); opacity: 1; } 38% { transform: scaleX(.28); opacity: 1; } 42% { transform: scaleX(.28); opacity: 0; } 44% { transform: scaleX(0); opacity: 1; } 96% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    .hd { animation: hd 8s linear infinite; }
    @keyframes hd { 0%, 11.9% { stroke: #3d4141; } 12%, 36% { stroke: #00ffe0; } 36.1%, 100% { stroke: #3d4141; } }
    .hm1 { animation: hm1 8s linear infinite; }
    @keyframes hm1 { 0%, 53.9% { stroke: #3d4141; } 54%, 66% { stroke: #00ffe0; } 66.1%, 100% { stroke: #3d4141; } }
    .ht { animation: ht 8s linear infinite; }
    @keyframes ht { 0%, 65.9% { stroke: #3d4141; } 66%, 78% { stroke: #00ffe0; } 78.1%, 100% { stroke: #3d4141; } }
    .hm2 { animation: hm2 8s linear infinite; }
    @keyframes hm2 { 0%, 77.9% { stroke: #3d4141; } 78%, 90% { stroke: #00ffe0; } 90.1%, 100% { stroke: #3d4141; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse, .hl, .stg, .chk, .bar, .drain, .hand, .led, .req, .rsp, .roll { animation: none !important; }
      .dot, .req, .rsp { display: none; }
    }
  </style>
  <rect width="1000" height="390" rx="22" fill="#0a0b0b"/>
  <text x="40" y="40" class="k">ONE QUESTION, ONE BOUNDED RUN</text>
  <text x="960" y="40" class="k" text-anchor="end">70 S PER RUN · 20 S PER MODEL STEP · 8 ACTIONS PER REQUEST</text>
  <path class="wire" d="M190 185 H241"/>
  <path class="wire" d="M265 161 C265 110 300 110 340 110"/>
  <path class="wire" d="M265 209 C265 270 300 270 340 270"/>
  <path class="wire" d="M520 110 C700 110 700 185 820 185"/>
  <path class="wire" d="M480 270 H510"/>
  <path class="wire" d="M670 270 H700"/>
  <path class="wire" d="M800 270 C815 270 815 185 820 185"/>
  <g filter="url(#glow)" opacity=".8">
    <path class="flow" d="M190 185 H241"/>
    <path class="flow" d="M265 161 C265 110 300 110 340 110"/>
    <path class="flow" d="M265 209 C265 270 300 270 340 270"/>
    <path class="flow" d="M520 110 C700 110 700 185 820 185"/>
    <path class="flow" d="M480 270 H510"/>
    <path class="flow" d="M670 270 H700"/>
    <path class="flow" d="M800 270 C815 270 815 185 820 185"/>
  </g>
  <rect x="40" y="150" width="150" height="70" rx="14" fill="url(#card)" stroke="#3d4141"/>
  <text x="56" y="181" class="t">Your Pin asks</text>
  <text x="56" y="199" class="s">one call, one run</text>
  <circle cx="265" cy="185" r="24" fill="url(#core)" stroke="#00ffe0"/>
  <text x="265" y="189" class="l" text-anchor="middle">route</text>
  <text x="265" y="232" class="k" text-anchor="middle" font-size="9px">IN CODE</text>
  <text x="340" y="70" class="k">D1 · DIRECT ROUTE, NO MODEL</text>
  <rect x="340" y="80" width="180" height="60" rx="14" fill="url(#card)" stroke="#3d4141" class="hd"/>
  <text x="356" y="107" class="t">Direct route</text>
  <text x="356" y="125" class="s">a fixed, auditable answer</text>
  <text x="340" y="156" class="m">fixed phrasings · the location step before local weather</text>
  <text x="340" y="230" class="k">A1 · ONE TASK      A2 · MORE THAN ONE TOOL CALL</text>
  <rect x="340" y="240" width="140" height="60" rx="14" fill="url(#card)" stroke="#3d4141" class="hm1"/>
  <text x="356" y="267" class="t">Model step</text>
  <text x="356" y="285" class="s">at most 20 s</text>
  <rect x="510" y="240" width="160" height="60" rx="14" fill="url(#card)" stroke="#3d4141" class="ht"/>
  <text x="526" y="267" class="t">Server tool</text>
  <text x="526" y="285" class="s">search, maps, music, MCP</text>
  <rect x="700" y="240" width="100" height="60" rx="14" fill="url(#card)" stroke="#3d4141" class="hm2"/>
  <text x="716" y="267" class="t">Model step</text>
  <text x="716" y="285" class="s">at most 20 s</text>
  <text x="590" y="318" class="m" text-anchor="middle">tool results are untrusted data</text>
  <rect x="820" y="150" width="140" height="70" rx="14" fill="url(#core)" stroke="#00ffe0"/>
  <text x="836" y="181" class="t">Respond</text>
  <text x="836" y="199" class="s">before the deadline</text>
  <text x="190" y="316" class="k" font-size="9px">ONE ABSOLUTE DEADLINE, 70 S</text>
  <rect x="190" y="329" width="630" height="6" rx="3" fill="#1f2121"/>
  <rect class="drain" x="190" y="329" width="630" height="6" rx="3" fill="#00ffe0" filter="url(#glow)"/>
  <text x="190.0" y="352" class="m" text-anchor="start">0 s</text>
  <text x="370.0" y="352" class="m" text-anchor="middle">20 s</text>
  <text x="550.0" y="352" class="m" text-anchor="middle">40 s</text>
  <text x="730.0" y="352" class="m" text-anchor="middle">60 s</text>
  <text x="820.0" y="352" class="m" text-anchor="end">70 s</text>
  <text x="40" y="380" class="n">Policy lives in code, not in the prompt: a call or a text needs the wearer's exact confirmation, and a locked Pin is refused.</text>
  <g filter="url(#glow)">
    <circle class="req" r="4" style="offset-path: path('M190 185 H265 V161 C265 110 300 110 340 110 H520 C700 110 700 185 820 185'); animation-duration: 8s; animation-delay: 0s"/>
    <circle class="rsp" r="4" style="offset-path: path('M190 185 H265 V209 C265 270 300 270 340 270 H800 C815 270 815 185 820 185'); animation-duration: 8s; animation-delay: 0s"/>
  </g>
</svg>
