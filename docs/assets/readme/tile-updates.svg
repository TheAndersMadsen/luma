<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="title desc">
  <title id="title">Keeps itself current</title>
  <desc id="desc">Two arrows turning in a circle around a check mark.</desc>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
    .chk { stroke-dasharray: 30; animation: tick 7s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes tick { 0% { stroke-dashoffset: 30; } 25%, 80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 30; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="96" height="96" rx="24" fill="#0a0b0b" stroke="#1f2121"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g class="spin">
      <path d="M68.7 40.5 A22 22 0 0 0 26.3 44.2" stroke="#00ffe0"/>
      <path d="M32 38.5 L26.3 44.2 L22.9 36.9" stroke="#00ffe0"/>
      <path d="M27.3 55.5 A22 22 0 0 0 69.7 51.8" stroke="#00ffe0"/>
      <path d="M64 57.5 L69.7 51.8 L73.1 59.1" stroke="#00ffe0"/>
    </g>
    <path class="chk" d="M40 48 l6 6 l12 -13" stroke="#f5f5f5" stroke-width="3.5"/>
  </g>
</svg>
