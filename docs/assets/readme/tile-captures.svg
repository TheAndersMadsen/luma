<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="title desc">
  <title id="title">Every capture, in your Center</title>
  <desc id="desc">A camera whose aperture breathes.</desc>
  <style>
    .iris { transform-box: fill-box; transform-origin: center; animation: iris 3s ease-in-out infinite; }
    @keyframes iris { 0%, 100% { transform: scale(1); } 50% { transform: scale(.55); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="96" height="96" rx="24" fill="#0a0b0b" stroke="#1f2121"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 30 l4 -6 h16 l4 6" stroke="#f5f5f5"/>
    <rect x="16" y="30" width="64" height="42" rx="9" stroke="#f5f5f5"/>
    <circle cx="48" cy="51" r="12" stroke="#00ffe0"/>
    <circle class="iris" cx="48" cy="51" r="5" fill="#00ffe0" stroke="none"/>
    <circle cx="70" cy="40" r="2" fill="#f5f5f5" stroke="none"/>
  </g>
</svg>
