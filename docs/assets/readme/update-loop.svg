  <line class="bar2" x1="392" y1="248" x2="508" y2="248" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="532" y1="248" x2="648" y2="248" stroke="#3d4141" stroke-width="2"/>
  <line class="bar3" x1="532" y1="248" x2="648" y2="248" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="672" y1="248" x2="788" y2="248" stroke="#3d4141" stroke-width="2"/>
