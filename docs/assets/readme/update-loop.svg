  <text x="696" y="107" class="s">a Luma Center's /api/version</text>
  <text x="305" y="84" class="l" text-anchor="middle">cosign</text>
  <text x="655" y="84" class="l" text-anchor="middle">newest?</text>
  <text x="290" y="168" class="m" text-anchor="middle">downloaded by your server</text>
  <g transform="translate(560 162)">
    <circle r="14" fill="#131414" stroke="#3d4141"/>
