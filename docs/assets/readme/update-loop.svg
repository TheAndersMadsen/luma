    <path class="flow" d="M630 92 H680"/>
  </g>
  <path class="thin" d="M480 122 C480 190 100 160 100 224" marker-end="url(#arrow)"/>
  <rect x="40" y="62" width="240" height="60" rx="14" fill="url(#card)" stroke="#3d4141"/>
  <text x="56" y="89" class="t">Maintainer's machine</text>
  <text x="56" y="107" class="s">builds and signs each release</text>
  <rect x="330" y="62" width="300" height="60" rx="14" fill="url(#card)" stroke="#3d4141"/>
  <text x="346" y="89" class="t">GitHub release</text>
  <text x="346" y="107" class="s">5 files, signed SHA256SUMS, public images</text>
