  <line x1="812" y1="248" x2="928" y2="248" stroke="#3d4141" stroke-width="2"/>
  <line class="bar5" x1="812" y1="248" x2="928" y2="248" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <circle class="stg0" cx="100" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk0" d="M95.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Download</text>
  <text x="100" y="296" class="m" text-anchor="middle">5 files, from GitHub</text>
  <circle class="stg1" cx="240" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk1" d="M235.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Verify signature</text>
  <text x="240" y="296" class="m" text-anchor="middle">the maintainer's key</text>
  <circle class="stg2" cx="380" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk2" d="M375.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Back up</text>
  <text x="380" y="296" class="m" text-anchor="middle">nothing is lost</text>
  <circle class="stg3" cx="520" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk3" d="M515.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="520" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Set up</text>
  <text x="520" y="296" class="m" text-anchor="middle">your saved values</text>
  <circle class="stg4" cx="660" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk4" d="M655.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="660" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Deploy</text>
  <text x="660" y="296" class="m" text-anchor="middle">the new release</text>
  <circle class="stg5" cx="800" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk5" d="M795.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Verify</text>
  <text x="800" y="296" class="m" text-anchor="middle">a live check</text>
  <circle class="stg6" cx="940" cy="248" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="chk6" d="M935.5 248 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="940" y="280" class="n" text-anchor="middle" fill="#f5f5f5" font-weight="600">Live</text>
  <text x="940" y="296" class="m" text-anchor="middle">Center shows it</text>
  <path class="roll" d="M800 308 C800 356 380 356 380 310" marker-end="url(#arrow)"/>
  <text x="590.0" y="376" class="n" text-anchor="middle">If a nightly update fails after set-up, the backup goes back and the previous release runs again.</text>
  <g filter="url(#glow)">
