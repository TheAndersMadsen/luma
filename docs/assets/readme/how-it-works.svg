<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="title desc">
  <title id="title">How Luma fits together</title>
  <desc id="desc">Your Ai Pin talks to Cosmos, the Pin's cloud on your server. You use Center, your humane.center, in a browser; Center reads everything from Cosmos. Cosmos calls AI, speech, maps, and music providers with your own keys. The Pin holds no provider keys.</desc>
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="340">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2121"/>
      <stop offset="1" stop-color="#131414"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#004d43"/>
      <stop offset="1" stop-color="#0f1514"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
    .t { fill: #f5f5f5; font-size: 18px; font-weight: 600; }
    .s { fill: #a9abab; font-size: 13px; }
    .k { fill: #727679; font-size: 11px; letter-spacing: 2px; }
    .l { fill: #00ffe0; font-size: 11.5px; letter-spacing: .4px; }
    .wire { fill: none; stroke: #005e59; stroke-width: 2; }
    .flow { fill: none; stroke: #00ffe0; stroke-width: 2; stroke-dasharray: 4 14; animation: flow 1.1s linear infinite; }
    .dot { fill: #d2fff8; offset-rotate: 0deg; animation: move 2.6s cubic-bezier(.45,0,.55,1) infinite; }
    .p1 { offset-path: path("M230 110 H520"); }
    .p2 { offset-path: path("M230 250 H320"); animation-delay: .4s; }
    .p3 { offset-path: path("M490 250 H605 V160"); animation-delay: 1.1s; }
    .p4 { offset-path: path("M690 110 C735 110 745 110 796 110"); animation-delay: 1.5s; }
    .p5 { offset-path: path("M690 110 C735 110 745 158 796 158"); animation-delay: 1.8s; }
    .p6 { offset-path: path("M690 110 C735 110 745 206 796 206"); animation-delay: 2.1s; }
    .p7 { offset-path: path("M690 110 C735 110 745 254 796 254"); animation-delay: 2.4s; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes move { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .pulse { animation: none; }
      .dot { display: none; }
    }
  </style>

  <rect width="1000" height="340" rx="22" fill="#0a0b0b"/>

  <!-- Your server -->
  <rect x="290" y="24" width="440" height="292" rx="18" fill="#0f0f0f" stroke="#3d4141" stroke-dasharray="6 6"/>
  <text x="312" y="50" class="k">YOUR SERVER</text>

  <!-- Wires: a dim base with an animated dash flowing over it -->
  <g>
    <path class="wire" d="M230 110 H520"/>
    <path class="wire" d="M230 250 H320"/>
    <path class="wire" d="M490 250 H605 V160"/>
    <path class="wire" d="M690 110 C735 110 745 110 796 110 M690 110 C735 110 745 158 796 158 M690 110 C735 110 745 206 796 206 M690 110 C735 110 745 254 796 254"/>
  </g>
  <g filter="url(#glow)" opacity=".8">
    <path class="flow" d="M230 110 H520"/>
    <path class="flow" d="M230 250 H320"/>
    <path class="flow" d="M490 250 H605 V160"/>
    <path class="flow" d="M690 110 C735 110 745 110 796 110 M690 110 C735 110 745 158 796 158 M690 110 C735 110 745 206 796 206 M690 110 C735 110 745 254 796 254"/>
  </g>
  <g filter="url(#glow)">
    <circle class="dot p1" r="4"/>
    <circle class="dot p2" r="4"/>
    <circle class="dot p3" r="4"/>
    <circle class="dot p4" r="3"/>
    <circle class="dot p5" r="3"/>
    <circle class="dot p6" r="3"/>
    <circle class="dot p7" r="3"/>
  </g>

  <text x="375" y="96" class="l" text-anchor="middle">voice · photos · notes</text>
  <text x="375" y="128" class="l" text-anchor="middle" opacity=".8">TLS, the Pin's own certificate</text>
  <text x="275" y="240" class="l" text-anchor="middle">HTTPS</text>
  <text x="612" y="236" class="l">your sign-in</text>
  <text x="742" y="88" class="l" text-anchor="middle">your keys</text>

  <!-- Your Ai Pin -->
  <rect x="40" y="60" width="190" height="100" rx="16" fill="url(#card)" stroke="#3d4141"/>
  <text x="62" y="102" class="t">Your Ai Pin</text>
  <text x="62" y="126" class="s">voice, photos, music</text>
  <text x="62" y="182" class="k">HOLDS NO PROVIDER KEYS</text>

  <!-- You, in a browser -->
  <rect x="40" y="200" width="190" height="100" rx="16" fill="url(#card)" stroke="#3d4141"/>
  <text x="62" y="242" class="t">You</text>
  <text x="62" y="266" class="s">in a browser</text>

  <!-- Cosmos -->
  <rect x="520" y="60" width="170" height="100" rx="16" fill="url(#core)" stroke="#00ffe0" class="pulse"/>
  <text x="542" y="102" class="t">Cosmos</text>
  <text x="542" y="126" class="s">the Pin's cloud</text>

  <!-- Center -->
  <rect x="320" y="200" width="170" height="100" rx="16" fill="url(#card)" stroke="#3d4141"/>
  <text x="342" y="242" class="t">Center</text>
  <text x="342" y="266" class="s">your humane.center</text>

  <!-- Providers -->
  <text x="796" y="50" class="k">YOUR PROVIDERS</text>
  <g>
    <rect x="796" y="92" width="170" height="36" rx="10" fill="url(#card)" stroke="#3d4141"/>
    <text x="814" y="115" class="s">AI model</text>
    <rect x="796" y="140" width="170" height="36" rx="10" fill="url(#card)" stroke="#3d4141"/>
    <text x="814" y="163" class="s">Speech</text>
    <rect x="796" y="188" width="170" height="36" rx="10" fill="url(#card)" stroke="#3d4141"/>
    <text x="814" y="211" class="s">Maps, search, weather</text>
    <rect x="796" y="236" width="170" height="36" rx="10" fill="url(#card)" stroke="#3d4141"/>
    <text x="814" y="259" class="s">Music</text>
  </g>
</svg>
