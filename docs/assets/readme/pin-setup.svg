<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Connecting a Pin over USB</title>
  <desc id="desc">A stock Ai Pin sits on the USB interposer, which connects through a USB-C data cable to desktop Chrome or Edge showing Center. Guided setup then lights its seven stages in order: connect, network and time, install Luma, required services, connect to your Luma, Pin passcode, and try it.</desc>
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="300"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2121"/><stop offset="1" stop-color="#131414"/></linearGradient>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif; }
    .t { fill: #f5f5f5; font-size: 15px; font-weight: 600; }
    .s { fill: #a9abab; font-size: 12px; }
    .k { fill: #727679; font-size: 11px; letter-spacing: 2px; }
    .st { fill: #a9abab; font-size: 12px; }
    .wire { fill: none; stroke: #005e59; stroke-width: 2; }
    .flow { fill: none; stroke: #00ffe0; stroke-width: 2; stroke-dasharray: 4 14; animation: flow 1.1s linear infinite; }
    .dot { fill: #d2fff8; offset-path: path("M226 92 H774"); animation: move 3.2s cubic-bezier(.45,0,.55,1) infinite; }
    .dot.back { offset-path: path("M774 92 H226"); animation-delay: 1.6s; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes move { 0% { offset-distance: 0%; opacity: 0; } 10% { opacity: 1; } 88% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
    .s0 { animation: on0 12.0s linear infinite; }
    @keyframes on0 { 0%, 7.9% { fill: #1f2121; stroke: #3d4141; } 8%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c0 { animation: chk0 12.0s linear infinite; }
    @keyframes chk0 { 0%, 7.9% { opacity: 0; } 8%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .b0 { animation: bar0 12.0s linear infinite; }
    @keyframes bar0 { 0%, 8% { stroke-dashoffset: 100; } 19%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    .s1 { animation: on1 12.0s linear infinite; }
    @keyframes on1 { 0%, 18.9% { fill: #1f2121; stroke: #3d4141; } 19%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c1 { animation: chk1 12.0s linear infinite; }
    @keyframes chk1 { 0%, 18.9% { opacity: 0; } 19%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .b1 { animation: bar1 12.0s linear infinite; }
    @keyframes bar1 { 0%, 19% { stroke-dashoffset: 100; } 30%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    .s2 { animation: on2 12.0s linear infinite; }
    @keyframes on2 { 0%, 29.9% { fill: #1f2121; stroke: #3d4141; } 30%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c2 { animation: chk2 12.0s linear infinite; }
    @keyframes chk2 { 0%, 29.9% { opacity: 0; } 30%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .b2 { animation: bar2 12.0s linear infinite; }
    @keyframes bar2 { 0%, 30% { stroke-dashoffset: 100; } 41%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    .s3 { animation: on3 12.0s linear infinite; }
    @keyframes on3 { 0%, 40.9% { fill: #1f2121; stroke: #3d4141; } 41%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c3 { animation: chk3 12.0s linear infinite; }
    @keyframes chk3 { 0%, 40.9% { opacity: 0; } 41%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .b3 { animation: bar3 12.0s linear infinite; }
    @keyframes bar3 { 0%, 41% { stroke-dashoffset: 100; } 52%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    .s4 { animation: on4 12.0s linear infinite; }
    @keyframes on4 { 0%, 51.9% { fill: #1f2121; stroke: #3d4141; } 52%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c4 { animation: chk4 12.0s linear infinite; }
    @keyframes chk4 { 0%, 51.9% { opacity: 0; } 52%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .b4 { animation: bar4 12.0s linear infinite; }
    @keyframes bar4 { 0%, 52% { stroke-dashoffset: 100; } 63%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    .s5 { animation: on5 12.0s linear infinite; }
    @keyframes on5 { 0%, 62.9% { fill: #1f2121; stroke: #3d4141; } 63%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c5 { animation: chk5 12.0s linear infinite; }
    @keyframes chk5 { 0%, 62.9% { opacity: 0; } 63%, 94% { opacity: 1; } 100% { opacity: 0; } }
    .b5 { animation: bar5 12.0s linear infinite; }
    @keyframes bar5 { 0%, 63% { stroke-dashoffset: 100; } 74%, 94% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 100; } }
    .s6 { animation: on6 12.0s linear infinite; }
    @keyframes on6 { 0%, 73.9% { fill: #1f2121; stroke: #3d4141; } 74%, 94% { fill: #00ffe0; stroke: #00ffe0; } 100% { fill: #1f2121; stroke: #3d4141; } }
    .c6 { animation: chk6 12.0s linear infinite; }
    @keyframes chk6 { 0%, 73.9% { opacity: 0; } 74%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, [class^="s"], [class^="c"], [class^="b"] { animation: none !important; }
      .dot { display: none; }
    }
  </style>
  <rect width="1000" height="300" rx="22" fill="#0a0b0b"/>
  <text x="40" y="38" class="k">OVER USB, FROM YOUR BROWSER</text>
  <path class="wire" d="M210 92 H790"/>
  <g filter="url(#glow)" opacity=".8"><path class="flow" d="M210 92 H790"/></g>
  <g filter="url(#glow)"><circle class="dot" r="4"/><circle class="dot back" r="3"/></g>
  <rect x="40" y="58" width="170" height="68" rx="14" fill="url(#card)" stroke="#3d4141"/>
  <text x="58" y="88" class="t">Ai Pin</text>
  <text x="58" y="108" class="s">service contacts</text>
  <rect x="290" y="58" width="170" height="68" rx="14" fill="url(#card)" stroke="#3d4141"/>
  <text x="308" y="88" class="t">USB interposer</text>
  <text x="308" y="108" class="s">on the contacts</text>
  <rect x="540" y="58" width="170" height="68" rx="14" fill="url(#card)" stroke="#3d4141"/>
  <text x="558" y="88" class="t">USB-C data cable</text>
  <text x="558" y="108" class="s">plugged straight in</text>
  <rect x="790" y="58" width="170" height="68" rx="14" fill="url(#card)" stroke="#00ffe0"/>
  <text x="808" y="88" class="t">Chrome or Edge</text>
  <text x="808" y="108" class="s">Center over HTTPS</text>
  <text x="500" y="154" class="s" text-anchor="middle">Your Wi-Fi password and the apps travel over the cable, never through the server.</text>
  <text x="40" y="200" class="k">GUIDED SETUP</text>
  <line x1="82.0" y1="236" x2="201.3" y2="236" stroke="#3d4141" stroke-width="2"/>
  <line class="b0" x1="82.0" y1="236" x2="201.3" y2="236" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="225.3" y1="236" x2="344.7" y2="236" stroke="#3d4141" stroke-width="2"/>
  <line class="b1" x1="225.3" y1="236" x2="344.7" y2="236" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="368.7" y1="236" x2="488.0" y2="236" stroke="#3d4141" stroke-width="2"/>
  <line class="b2" x1="368.7" y1="236" x2="488.0" y2="236" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="512.0" y1="236" x2="631.3" y2="236" stroke="#3d4141" stroke-width="2"/>
  <line class="b3" x1="512.0" y1="236" x2="631.3" y2="236" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="655.3" y1="236" x2="774.7" y2="236" stroke="#3d4141" stroke-width="2"/>
  <line class="b4" x1="655.3" y1="236" x2="774.7" y2="236" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <line x1="798.7" y1="236" x2="918.0" y2="236" stroke="#3d4141" stroke-width="2"/>
  <line class="b5" x1="798.7" y1="236" x2="918.0" y2="236" stroke="#00ffe0" stroke-width="2" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" filter="url(#glow)"/>
  <circle class="s0" cx="70.0" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c0" d="M65.5 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70.0" y="268" class="st" text-anchor="middle">1. Connect</text>
  <circle class="s1" cx="213.3" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c1" d="M208.8 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="213.3" y="268" class="st" text-anchor="middle">2. Network</text>
  <circle class="s2" cx="356.7" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c2" d="M352.2 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="356.7" y="268" class="st" text-anchor="middle">3. Install</text>
  <circle class="s3" cx="500.0" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c3" d="M495.5 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500.0" y="268" class="st" text-anchor="middle">4. Services</text>
  <circle class="s4" cx="643.3" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c4" d="M638.8 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="643.3" y="268" class="st" text-anchor="middle">5. Pair</text>
  <circle class="s5" cx="786.7" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c5" d="M782.2 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="786.7" y="268" class="st" text-anchor="middle">6. Passcode</text>
  <circle class="s6" cx="930.0" cy="236" r="11" fill="#00ffe0" stroke="#00ffe0" stroke-width="1.5"/>
  <path class="c6" d="M925.5 236 l3.2 3.4 l6 -6.6" fill="none" stroke="#0a0b0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="930.0" y="268" class="st" text-anchor="middle">7. Try it</text>
</svg>
