<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="title desc">
  <title id="title">Ask it anything</title>
  <desc id="desc">A microphone with sound waves.</desc>
  <style>
    .w { animation: wave 2.4s ease-in-out infinite; }
    .w2 { animation-delay: .4s; }
    @keyframes wave { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="96" height="96" rx="24" fill="#0a0b0b" stroke="#1f2121"/>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="39" y="22" width="18" height="32" rx="9" stroke="#00ffe0"/>
    <path d="M30 46 a18 18 0 0 0 36 0" stroke="#f5f5f5"/>
    <path d="M48 64 V74 M38 74 H58" stroke="#f5f5f5"/>
    <path class="w" d="M72 34 a14 14 0 0 1 0 20" stroke="#00ffe0" stroke-width="2.5"/>
    <path class="w w2" d="M80 28 a22 22 0 0 1 0 32" stroke="#00ffe0" stroke-width="2.5"/>
    <path class="w" d="M24 34 a14 14 0 0 0 0 20" stroke="#00ffe0" stroke-width="2.5"/>
    <path class="w w2" d="M16 28 a22 22 0 0 0 0 32" stroke="#00ffe0" stroke-width="2.5"/>
  </g>
