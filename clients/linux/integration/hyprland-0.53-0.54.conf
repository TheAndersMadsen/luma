# OPTIONAL example for the named-rule syntax documented in Hyprland 0.53/0.54.
# Do not paste into a different config format/version without checking its manual.
# Check `hyprctl version` and `hyprctl binds` before adding a binding.
# Nothing in the Cosmos installer modifies your Hyprland files.
# Keep the app tiled by omitting these rules entirely.

# Candidate binding; check that it is unused. Do NOT replace Super+C or Super+Space.
# Launching `cosmos` again brings the running window back after Escape hid it.
bind = SUPER CTRL ALT, C, exec, ~/.local/bin/cosmos

windowrule {
    name = cosmos
    match:class = ^(dk.andersmadsen.cosmos.linux)$
    float = on
    size = 760 600
    center = on
    rounding = 8
}
# Verify app_id/class with `hyprctl clients`; adjust match:class if your Qt setup differs.
