# NetworkUtils uses cleartext HTTP and disables redirects, so both Cosmos
# connectivity authorities answer directly on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name connectivity-check.cosmos.humane.cloud n.cosmos.humane.cloud;
    absolute_redirect off;

    location = / {
        if ($request_method = GET)  { return 204; }
        if ($request_method = HEAD) { return 204; }
        return 405;
    }

    location / { return 404; }
}
