# Stock NetworkUtils uses cleartext HTTP and disables redirects. Both retained
# firmware authorities must answer directly on port 80; the Pin's exact-host
# resolver points them at the operator edge without public humane.cloud DNS.
server {
    listen 80;
    listen [::]:80;
    server_name connectivity-check.cosmos.humane.cloud n.cosmos.humane.cloud;
    absolute_redirect off;

    location = / {
        if ($request_method = GET)  { return 204; }
        if ($request_method = HEAD) { return 204; }
        return 405;
    }

    location / { return 404; }
}
