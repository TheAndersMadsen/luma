# Explicit local-development policy. Use with:
# docker compose -f compose.yaml -f platform/compose/development.yaml ...

x-development-labels: &development-labels
  dk.andersmadsen.ai-pin-revival.environment: development

# Optional while local identity is disabled. When the root CLI enables the
# identity profile, every OIDC verifier waits for Keycloak's health check before
# it fetches the initial JWKS.
x-development-identity-dependency: &development-identity-dependency
  keycloak:
    condition: service_healthy
    required: false

services:
  connectivity:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
    ports:
      - 127.0.0.1:${REVIVAL_CONNECTIVITY_PORT:-18080}:18080

  ai-bus:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
      CARRY_LLM_BASE_URL: ${CARRY_LLM_BASE_URL:-}
      CARRY_LLM_API_KEY: ${CARRY_LLM_API_KEY:-}
      CARRY_OPENROUTER_API_KEY: ${CARRY_OPENROUTER_API_KEY:-}
      CARRY_LLM_MODEL: ${CARRY_LLM_MODEL:-openai/gpt-5.6-luna}
      CARRY_LLM_REASONING_EFFORT: ${CARRY_LLM_REASONING_EFFORT:-}
      CARRY_LLM_MAX_TOKENS: ${CARRY_LLM_MAX_TOKENS:-512}
      CARRY_VISION_MODEL: ${CARRY_VISION_MODEL:-}
      CARRY_INTERSTITIAL_BASE_URL: ${CARRY_INTERSTITIAL_BASE_URL:-}
      CARRY_INTERSTITIAL_MODEL: ${CARRY_INTERSTITIAL_MODEL:-}
      CARRY_INTERSTITIAL_API_KEY: ${CARRY_INTERSTITIAL_API_KEY:-}
      CARRY_SERPAPI_KEY: ${CARRY_SERPAPI_KEY:-}
      CARRY_GOOGLE_MAPS_KEY: ${CARRY_GOOGLE_MAPS_KEY:-}
      CARRY_PIRATE_WEATHER_KEY: ${CARRY_PIRATE_WEATHER_KEY:-}
      CARRY_WOLFRAM_APP_ID: ${CARRY_WOLFRAM_APP_ID:-}
      CARRY_PPLX_API_KEY: ${CARRY_PPLX_API_KEY:-}
      CARRY_PPLX_MODEL: ${CARRY_PPLX_MODEL:-sonar}
      CARRY_SHARE_TOKEN_SECRET: ${CARRY_SHARE_TOKEN_SECRET:-}
      CARRY_MUSICBRAINZ_BASE_URL: ${CARRY_MUSICBRAINZ_BASE_URL:-https://musicbrainz.org}
      CARRY_SHOPPING_VISUAL_SEARCH_URL: ${CARRY_SHOPPING_VISUAL_SEARCH_URL:-}
      CARRY_SHOPPING_ALLOWED_HOSTS: ${CARRY_SHOPPING_ALLOWED_HOSTS:-}
      CARRY_SHOPPING_API_KEY: ${CARRY_SHOPPING_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-${CARRY_AZURE_SPEECH_KEY:-}}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-${CARRY_AZURE_SPEECH_REGION:-}}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-${CARRY_AZURE_SPEECH_VOICE:-en-US-AvaMultilingualNeural}}
    ports:
      - 127.0.0.1:${REVIVAL_AI_BUS_GRPC_PORT:-15051}:15051

  account:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
    ports:
      - 127.0.0.1:${REVIVAL_ACCOUNT_GRPC_PORT:-15052}:15051

  contacts:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
    ports:
      - 127.0.0.1:${REVIVAL_CONTACTS_GRPC_PORT:-15053}:15051

  feature-flags:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
    ports:
      - 127.0.0.1:${REVIVAL_FEATURE_FLAGS_GRPC_PORT:-15054}:15051

  notable-events:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
    ports:
      - 127.0.0.1:${REVIVAL_NOTABLE_EVENTS_GRPC_PORT:-15055}:15051

  provisioning:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      CARRY_AUTH_MODE: ${CARRY_AUTH_MODE:-development-insecure}
      CARRY_ENVIRONMENT: development
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
      CARRY_OIDC_ISSUER: ${REVIVAL_LOCAL_OIDC_ISSUER:-}
      CARRY_OIDC_JWKS_URI: ${REVIVAL_LOCAL_OIDC_JWKS_URI:-}
      CARRY_DUC_CA_CERT: ${CARRY_DUC_CA_CERT:-/run/secrets/duc_ca_cert}
      CARRY_DUC_CA_KEY: ${CARRY_DUC_CA_KEY:-/run/secrets/duc_ca_key}
    secrets:
      - duc_ca_cert
      - duc_ca_key
    ports:
      - 127.0.0.1:${REVIVAL_PROVISIONING_GRPC_PORT:-15056}:15051

  center:
    depends_on: *development-identity-dependency
    labels:
      <<: *development-labels
    restart: "no"
    environment:
      REVIVAL_DEPLOYMENT_ENVIRONMENT: development
    ports:
      - 127.0.0.1:${REVIVAL_CENTER_PORT:-4000}:4000

  keycloak:
    labels:
      <<: *development-labels
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HOSTNAME: http://localhost:${REVIVAL_KEYCLOAK_PORT:-8088}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - 127.0.0.1:${REVIVAL_KEYCLOAK_PORT:-8088}:8080
    volumes:
      - keycloak-data:/opt/keycloak/data
    secrets:
      - source: identity_realm
        target: /opt/keycloak/data/import/realm.json

  device-builder:
    profiles:
      - build-tools
    build:
      context: .
      dockerfile: platform/containers/pin-builder/Dockerfile
    platform: linux/amd64
    image: ai-pin-revival/device-builder:${REVIVAL_RELEASE_ID:?set REVIVAL_RELEASE_ID to the immutable release id}
    working_dir: /workspace
    read_only: true
    init: true
    volumes:
      - .:/workspace:ro
      - ${REVIVAL_DATA_DIR:?set REVIVAL_DATA_DIR outside the source tree}:/workspace/state
      - device-android-cache:/cache/android
      - device-cargo-cache:/cache/cargo
      - device-gradle-cache:/cache/gradle
      - device-npm-cache:/cache/npm
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 6g
    labels:
      dk.andersmadsen.ai-pin-revival.product: Ai Pin Revival
      dk.andersmadsen.ai-pin-revival.release: ${REVIVAL_RELEASE_ID:?set REVIVAL_RELEASE_ID to the immutable release id}
      dk.andersmadsen.ai-pin-revival.environment: development
      dk.andersmadsen.ai-pin-revival.component: pin-builder
      org.opencontainers.image.revision: ${REVIVAL_RELEASE_ID:?set REVIVAL_RELEASE_ID to the immutable release id}

networks:
  cosmos-internal:
    internal: false

secrets:
  duc_ca_cert:
    file: ${REVIVAL_SECRETS_DIR:?set REVIVAL_SECRETS_DIR outside the source tree}/pki/duc-ca.crt
  duc_ca_key:
    file: ${REVIVAL_SECRETS_DIR:?set REVIVAL_SECRETS_DIR outside the source tree}/pki/duc-ca.key
  identity_realm:
    file: ${REVIVAL_SECRETS_DIR:?set REVIVAL_SECRETS_DIR outside the source tree}/identity/realm.json

volumes:
  keycloak-data:
  device-android-cache:
  device-cargo-cache:
  device-gradle-cache:
  device-npm-cache:
