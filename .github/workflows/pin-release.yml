name: Pin release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (YYYY-MM-DD.N)
        required: true
        type: string
      version_code:
        description: Android versionCode
        required: true
        type: number

concurrency:
  group: pin-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'TheAndersMadsen/ai-pin-revival' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: pin-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Prepare protected build inputs
        env:
          SIGNING_ENV_BASE64: ${{ secrets.PIN_SIGNING_ENV_BASE64 }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.PIN_SIGNING_KEYSTORE_BASE64 }}
          PRIVATE_ASSETS_TAR_BASE64: ${{ secrets.PIN_PRIVATE_ASSETS_TAR_BASE64 }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/pin-inputs"
          mkdir -m 0700 -p "$inputs/secrets/pin" "$inputs/config/pin-assets" "$RUNNER_TEMP/pin-build" "$RUNNER_TEMP/pin-releases"
          printf '%s' "$SIGNING_ENV_BASE64" | base64 --decode > "$inputs/secrets/pin/signing.env"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$inputs/secrets/pin/compatibility.keystore"
          printf '%s' "$PRIVATE_ASSETS_TAR_BASE64" | base64 --decode | tar -xz -C "$inputs/config/pin-assets"
          chmod 0600 "$inputs/secrets/pin/signing.env" "$inputs/secrets/pin/compatibility.keystore"
          printf '%s\n' \
            "REVIVAL_CONFIG_DIR=$inputs/config" \
            "REVIVAL_SECRETS_DIR=$inputs/secrets" \
            "REVIVAL_PIN_SIGNING_STORE_FILE=$inputs/secrets/pin/compatibility.keystore" \
            "REVIVAL_BUILD_DIR=$RUNNER_TEMP/pin-build" \
            "REVIVAL_PIN_RELEASE_OUTPUT_DIR=$RUNNER_TEMP/pin-releases" >> "$GITHUB_ENV"
      - name: Build signed five-APK release
        run: |
          node ./revival pin release build \
            --version "${{ inputs.version }}" \
            --version-code "${{ inputs.version_code }}" \
            --json
      - name: Upload release store
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pin-release-${{ inputs.version }}
          path: ${{ runner.temp }}/pin-releases/
          if-no-files-found: error
          retention-days: 30
