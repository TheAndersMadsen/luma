name: immutable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/theandersmadsen/ai-pin-revival
  APPLICATION_REPOSITORY: ghcr.io/theandersmadsen/ai-pin-revival/application

jobs:
  coordinates:
    name: validate release coordinates
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: release
        name: Require an exact semantic version tag and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          revision="$(git rev-parse HEAD)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          created="$(git show -s --format=%cI HEAD)"
          printf 'version=%s\nrevision=%s\ncreated=%s\n' \
            "$version" "$revision" "$created" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Validate release and platform policies
        run: ./revival check platform --full

  pin-release:
    name: acquire exact signed Pin release
    needs: coordinates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Download and verify the exact signed Pin archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          coordinates="platform/distribution/pin-release-coordinates.json"
          source_repository="$(node -p "require('./$coordinates').signedReleaseSource.repository")"
          source_tag="$(node -p "require('./$coordinates').signedReleaseSource.tag")"
          source_archive="$(node -p "require('./$coordinates').signedReleaseSource.archive")"
          source_size="$(node -p "require('./$coordinates').signedReleaseSource.size")"
          source_sha256="$(node -p "require('./$coordinates').signedReleaseSource.sha256")"
          mkdir -p "$RUNNER_TEMP/release-pin"
          archive="$RUNNER_TEMP/release-pin/$source_archive"
          gh release download "$source_tag" \
            --repo "$source_repository" \
            --pattern "$source_archive" \
            --dir "$RUNNER_TEMP/release-pin"
          test "$(stat --format='%s' "$archive")" = "$source_size"
          printf '%s  %s\n' "$source_sha256" "$archive" | sha256sum --check --status
          PIN_ARCHIVE="$archive" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { describePinReleaseArchive } from "./platform/deploy/pin/import-release.mjs";
          const coordinates = JSON.parse(readFileSync("platform/distribution/pin-release-coordinates.json", "utf8"));
          const source = coordinates.signedReleaseSource;
          const expected = {
            archive: source.archive,
            sha256: source.sha256,
            size: source.size,
            releaseId: source.releaseId,
            version: coordinates.version,
            versionCode: coordinates.versionCode,
            signerSha256: source.signerSha256,
            manifestSha256: source.manifestSha256,
            receiptsSha256: source.receiptsSha256,
          };
          const actual = await describePinReleaseArchive({
            archive: process.env.PIN_ARCHIVE,
            expectedSigner: expected.signerSha256,
          });
          for (const [name, value] of Object.entries(expected)) {
            if (actual[name] !== value) throw new Error(`signed Pin release ${name} is not pinned`);
          }
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-pin
          path: ${{ runner.temp }}/release-pin/
          if-no-files-found: error
          retention-days: 2

  images:
    name: publish ${{ matrix.name }} linux/amd64 + linux/arm64
    needs: coordinates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cosmos
            title: Cosmos backend
            context: ./cosmos
            dockerfile: ./cosmos/Dockerfile
            build_contexts: wire_contracts=./contracts/wire
            release_id_arg: false
          - name: center
            title: Revival Center
            context: ./center
            dockerfile: ./center/Dockerfile
            build_contexts: wire_contracts=./contracts/wire
            release_id_arg: true
          - name: spotify-adapter
            title: Spotify adapter
            context: ./center/adapters/spotify
            dockerfile: ./center/adapters/spotify/Dockerfile
            build_contexts: ""
            release_id_arg: false
          - name: keycloak
            title: Optimized Keycloak
            context: .
            dockerfile: ./platform/containers/keycloak/Dockerfile
            build_contexts: ""
            release_id_arg: false
          - name: center-iroh-bridge
            title: Center iroh bridge
            context: .
            dockerfile: ./platform/containers/center-iroh-bridge/Dockerfile
            build_contexts: ""
            release_id_arg: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: image
        name: Build and publish immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ matrix.build_contexts }}
          build-args: ${{ matrix.release_id_arg && format('REVIVAL_RELEASE_ID={0}', needs.coordinates.outputs.revision) || '' }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Ai Pin Revival ${{ matrix.title }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.coordinates.outputs.revision }}
            org.opencontainers.image.version=${{ needs.coordinates.outputs.version }}
            org.opencontainers.image.created=${{ needs.coordinates.outputs.created }}
            dk.andersmadsen.ai-pin-revival.product=Ai Pin Revival
            dk.andersmadsen.ai-pin-revival.release=${{ needs.coordinates.outputs.revision }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,scope=release-${{ matrix.name }},mode=max
      - name: Record exact image digest
        env:
          COMPONENT: ${{ matrix.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          export REFERENCE="$IMAGE_PREFIX/$COMPONENT@$DIGEST"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const { COMPONENT: name, REFERENCE: reference, DIGEST: digest, RUNNER_TEMP: root } = process.env;
          if (!/^sha256:[0-9a-f]{64}$/.test(digest)) throw new Error("Buildx returned an invalid digest");
          const receipt = {
            schemaVersion: 2,
            name,
            reference,
            digest,
            platforms: ["linux/amd64", "linux/arm64"],
          };
          writeFileSync(`${root}/${name}.json`, `${JSON.stringify(receipt)}\n`, { flag: "wx" });
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 2

  application:
    name: publish digest-pinned Compose application
    needs: [coordinates, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-receipts
          merge-multiple: true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Require Docker Compose 2.34 or newer
        run: |
          set -euo pipefail
          version="$(docker compose version --short)"
          [[ "$version" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]]
          (( 10#${BASH_REMATCH[1]} > 2 || (10#${BASH_REMATCH[1]} == 2 && 10#${BASH_REMATCH[2]} >= 34) ))
      - name: Build and audit the secret-free publication model
        env:
          RELEASE_REVISION: ${{ needs.coordinates.outputs.revision }}
        run: |
          set -euo pipefail
          publication_env="$RUNNER_TEMP/release-publication.env"
          node platform/distribution/publication-environment.mjs \
            "$RUNNER_TEMP/release-receipts" "$publication_env" "$RELEASE_REVISION"
          docker compose --env-file "$publication_env" \
            -f compose.yaml -f platform/compose/production.yaml \
            --profile '*' \
            config --format json | node platform/distribution/audit-compose-publication.mjs
      - name: Publish the audited Compose application
        env:
          RELEASE_REVISION: ${{ needs.coordinates.outputs.revision }}
        run: |
          set -euo pipefail
          publication_env="$RUNNER_TEMP/release-publication.env"
          application_tag="$APPLICATION_REPOSITORY:${GITHUB_REF_NAME}"
          # --yes is limited to this reviewed publisher input. Runtime trust
          # prompts remain interactive and are never bypassed by the operator CLI.
          docker compose --env-file "$publication_env" \
            -f compose.yaml -f platform/compose/production.yaml \
            --profile '*' \
            publish --yes --resolve-image-digests "$application_tag"
          docker buildx imagetools inspect "$application_tag" \
            --format '{{json .Manifest}}' > "$RUNNER_TEMP/application-manifest.json"
          export APPLICATION_TAG="$application_tag"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/application-manifest.json`, "utf8"));
          const digest = manifest.digest;
          if (!/^sha256:[0-9a-f]{64}$/.test(digest)) throw new Error("OCI application digest is invalid");
          const repository = process.env.APPLICATION_TAG.replace(/:[^/:]+$/, "");
          const receipt = { schemaVersion: 1, reference: `oci://${repository}@${digest}`, digest };
          writeFileSync(`${process.env.RUNNER_TEMP}/application.json`, `${JSON.stringify(receipt)}\n`, { flag: "wx" });
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-application
          path: ${{ runner.temp }}/application.json
          if-no-files-found: error
          retention-days: 2

  operator-release:
    name: publish lean operator release asset
    needs: [coordinates, application, pin-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-receipts
          merge-multiple: true
      - name: Build and verify the operator bundle
        env:
          RELEASE_VERSION: ${{ needs.coordinates.outputs.version }}
          RELEASE_REVISION: ${{ needs.coordinates.outputs.revision }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/operator-release"
          pin_version="$(node -p "require('./platform/distribution/pin-release-coordinates.json').version")"
          node platform/distribution/build.mjs \
            --version "$RELEASE_VERSION" \
            --revision "$RELEASE_REVISION" \
            --repository "$SOURCE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --receipts "$RUNNER_TEMP/release-receipts" \
            --pin-archive "$RUNNER_TEMP/release-receipts/ai-pin-revival-pin-$pin_version.tar.gz" \
            --output "$output"
          (cd "$output" && sha256sum --check SHA256SUMS)
      - name: Sign and verify the canonical release descriptor
        env:
          RELEASE_VERSION: ${{ needs.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/operator-release"
          descriptor="$output/ai-pin-revival-$RELEASE_VERSION.release.json"
          bundle="$output/ai-pin-revival-$RELEASE_VERSION.release.sigstore.json"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-cli.yml@$GITHUB_REF"
          cosign sign-blob --yes --bundle "$bundle" "$descriptor"
          cosign verify-blob \
            --bundle "$bundle" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-identity "$identity" \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-name 'immutable release' \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            --certificate-github-workflow-trigger push \
            "$descriptor"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-pin-revival-operator-${{ needs.coordinates.outputs.version }}
          path: ${{ runner.temp }}/operator-release/
          if-no-files-found: error
          retention-days: 14
      - name: Create or reset the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          if release_state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$release_state" = true || {
              echo "release $RELEASE_TAG is already published and cannot be replaced" >&2
              exit 1
            }
            gh release edit "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Ai Pin Revival $RELEASE_VERSION"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Ai Pin Revival $RELEASE_VERSION" \
              --generate-notes
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
      - name: Upload every release asset to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/operator-release"
          pin_version="$(node -p "require('./platform/distribution/pin-release-coordinates.json').version")"
          gh release upload "$RELEASE_TAG" \
            "$output/ai-pin-revival-operator-$RELEASE_VERSION-linux.tar.gz" \
            "$output/ai-pin-revival-pin-$pin_version.tar.gz" \
            "$output/ai-pin-revival-$RELEASE_VERSION.release.json" \
            "$output/ai-pin-revival-$RELEASE_VERSION.release.sigstore.json" \
            "$output/SHA256SUMS"
      - name: Verify the exact remote assets and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/operator-release"
          verification="$RUNNER_TEMP/release-verification"
          pin_version="$(node -p "require('./platform/distribution/pin-release-coordinates.json').version")"
          asset_names=(
            "ai-pin-revival-operator-$RELEASE_VERSION-linux.tar.gz"
            "ai-pin-revival-pin-$pin_version.tar.gz"
            "ai-pin-revival-$RELEASE_VERSION.release.json"
            "ai-pin-revival-$RELEASE_VERSION.release.sigstore.json"
            "SHA256SUMS"
          )
          mkdir "$verification"
          gh release download "$RELEASE_TAG" --dir "$verification"
          diff --unified=0 \
            <(printf '%s\n' "${asset_names[@]}" | LC_ALL=C sort) \
            <(find "$verification" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          (cd "$output" && sha256sum "${asset_names[@]}") > "$RUNNER_TEMP/release-expected.sha256"
          (cd "$verification" && sha256sum --check "$RUNNER_TEMP/release-expected.sha256")
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx true
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -Fx false
