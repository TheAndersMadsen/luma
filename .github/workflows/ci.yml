# Fast component checks. Every job uses the same command a contributor runs
# locally, and no job contacts a server or device.
name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "diagrams/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "diagrams/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: platform checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: ./revival check platform --full

  center:
    name: center formatting and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Bind the Center cache to runner temp
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          runner_temp="$(/usr/bin/realpath -e -- "${RUNNER_TEMP}")"
          test "${runner_temp}" = "${RUNNER_TEMP}"
          test -f "${GITHUB_ENV}" && test ! -L "${GITHUB_ENV}"
          /usr/bin/printf 'NPM_CONFIG_CACHE=%s\n' \
            "${runner_temp}/center-npm-cache" >> "${GITHUB_ENV}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: restore Center npm download cache
        id: center-npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/center-npm-cache/_cacache
          key: center-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('center/package-lock.json', 'center/adapters/spotify/package-lock.json') }}
          restore-keys: |
            center-npm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: install from lockfile
        run: npm ci --prefix center
      - name: typecheck
        run: npm --prefix center run typecheck
      - name: focused component checks
        run: npm --prefix center test
      - name: UI component checks
        run: npm --prefix center run test:ui
      - name: production build
        env:
          REVIVAL_RELEASE_ID: source-check
        run: npm --prefix center run build
      - name: install and test Spotify adapter from its lockfile
        run: |
          npm ci --prefix center/adapters/spotify
          npm test --prefix center/adapters/spotify
      - name: clean in-tree residue
        if: ${{ always() }}
        run: |
          rm -rf center/node_modules center/.next center/adapters/spotify/node_modules
          rm -f center/tsconfig.tsbuildinfo center/next-env.d.ts
      - name: save Center npm download cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.center-npm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/center-npm-cache/_cacache
          key: center-npm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('center/package-lock.json', 'center/adapters/spotify/package-lock.json') }}

  cosmos:
    name: cosmos formatting and tests
    runs-on: ubuntu-24.04
    container:
      image: rust:1.91.1-trixie@sha256:867f1d1162913c401378a8504fb17fe2032c760dc316448766f150a130204aad
    env:
      CC: clang-21
      CXX: clang++-21
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-21
      RUSTFLAGS: -C link-arg=-fuse-ld=lld-21
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: cosmos_test
          POSTGRES_PASSWORD: cosmos_test_ci_only
          POSTGRES_DB: cosmos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmos_test -d cosmos_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Bind Cosmos Cargo state to runner temp
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          runner_temp="$(/usr/bin/realpath -e -- "${RUNNER_TEMP}")"
          test "${runner_temp}" = "${RUNNER_TEMP}"
          test -f "${GITHUB_ENV}" && test ! -L "${GITHUB_ENV}"
          /usr/bin/printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\n' \
            "${runner_temp}/cosmos-cargo-home" \
            "${runner_temp}/cosmos-cargo-target" >> "${GITHUB_ENV}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: pinned Cosmos native compiler
        run: bash cosmos/native/linux-toolchain.sh amd64 amd64
      - name: verified libwebrtc inputs
        run: |
          native_dir="$(python3 cosmos/native/prepare.py --cache "${RUNNER_TEMP}/webrtc")"
          printf 'LK_CUSTOM_WEBRTC=%s\n' "$native_dir" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@38ae5351029910ad7674ccfad89c37cbd636f3c4 # 1.91.1
        with:
          components: clippy, rustfmt
      - name: restore Cosmos Cargo downloads and target state
        id: cosmos-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/cosmos-cargo-home/registry
            ${{ runner.temp }}/cosmos-cargo-home/git
            ${{ runner.temp }}/cosmos-cargo-target
          key: cosmos-rust-v2-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('cosmos/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cosmos-rust-v2-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('cosmos/Cargo.lock', 'rust-toolchain.toml') }}-
            cosmos-rust-v2-${{ runner.os }}-${{ runner.arch }}-1.91.1-
      - name: formatting
        working-directory: cosmos
        run: cargo fmt --all --check
      - name: warnings-as-errors lint
        working-directory: cosmos
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: focused component checks
        working-directory: cosmos
        run: cargo test --workspace --locked
      - name: verified local recognition model
        run: python3 cosmos/native/prepare_stt.py --directory "${RUNNER_TEMP}/local-stt-model"
      - name: real native local recognition cancellation
        working-directory: cosmos
        env:
          REVIVAL_STT_TEST_MODEL: ${{ runner.temp }}/local-stt-model/ggml-base.bin
        run: cargo test -p cosmos-stt --locked tests::pinned_model_native_cancellation -- --ignored --exact --nocapture --test-threads=1
      - name: release-only 4096-bit RSA compatibility
        working-directory: cosmos
        run: |
          set -euo pipefail
          test "$(cargo test -p cosmos-crypto --locked tests::production_wrapping_key_is_4096_bit_and_accepts_explicit_sha1_oaep -- --ignored --exact --list | grep -Fxc 'tests::production_wrapping_key_is_4096_bit_and_accepts_explicit_sha1_oaep: test')" -eq 1
          cargo test -p cosmos-crypto --locked tests::production_wrapping_key_is_4096_bit_and_accepts_explicit_sha1_oaep -- --ignored --exact --test-threads=1
      - name: real Postgres lifecycle and atomic migration contention
        working-directory: cosmos
        env:
          COSMOS_TEST_DATABASE_URL: postgresql://cosmos_test:cosmos_test_ci_only@postgres:5432/cosmos_test
        run: |
          env -u COSMOS_STATE_DIR -u COSMOS_WORKLOAD COSMOS_TEST_DATABASE_URL="$COSMOS_TEST_DATABASE_URL" cargo test -p cosmos keydirectory::tests::a_second_workload_observes_import_replacement_revocation_and_reimport -- --exact --nocapture
          env -u COSMOS_STATE_DIR -u COSMOS_WORKLOAD COSMOS_TEST_DATABASE_URL="$COSMOS_TEST_DATABASE_URL" cargo test -p cosmos store_postgres::tests::many_concurrent_key_directories_migrate_one_fresh_postgres_schema_atomically -- --exact --nocapture
          env -u COSMOS_STATE_DIR -u COSMOS_WORKLOAD COSMOS_TEST_DATABASE_URL="$COSMOS_TEST_DATABASE_URL" cargo test -p cosmos ambiance_postgres -- --test-threads=1
      - name: save Cosmos Cargo downloads and target state
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cosmos-rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/cosmos-cargo-home/registry
            ${{ runner.temp }}/cosmos-cargo-home/git
            ${{ runner.temp }}/cosmos-cargo-target
          key: cosmos-rust-v2-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('cosmos/Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}

  pin-runtime:
    name: pin runtime formatting and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Bind Pin runtime Cargo state to runner temp
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          runner_temp="$(/usr/bin/realpath -e -- "${RUNNER_TEMP}")"
          test "${runner_temp}" = "${RUNNER_TEMP}"
          test -f "${GITHUB_ENV}" && test ! -L "${GITHUB_ENV}"
          /usr/bin/printf 'CARGO_HOME=%s\nCARGO_TARGET_DIR=%s\nGRADLE_USER_HOME=%s\n' \
            "${runner_temp}/pin-runtime-cargo-home" \
            "${runner_temp}/pin-runtime-cargo-target" \
            "${runner_temp}/pin-gradle-home" >> "${GITHUB_ENV}"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@38ae5351029910ad7674ccfad89c37cbd636f3c4 # 1.91.1
        with:
          components: rustfmt
      - name: restore Pin runtime Cargo downloads and target state
        id: pin-runtime-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/pin-runtime-cargo-home/registry
            ${{ runner.temp }}/pin-runtime-cargo-home/git
            ${{ runner.temp }}/pin-runtime-cargo-target
            ${{ runner.temp }}/pin-gradle-home/caches
            ${{ runner.temp }}/pin-gradle-home/wrapper
          key: pin-unit-v3-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('pin/runtime/core/Cargo.lock', 'pin/bridge/Cargo.lock', 'rust-toolchain.toml', 'pin/gradle/wrapper/gradle-wrapper.properties', 'pin/injector/gradle/wrapper/gradle-wrapper.properties', 'pin/**/*.gradle', 'pin/**/*.gradle.kts') }}-${{ github.sha }}
          restore-keys: |
            pin-unit-v3-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('pin/runtime/core/Cargo.lock', 'pin/bridge/Cargo.lock', 'rust-toolchain.toml', 'pin/gradle/wrapper/gradle-wrapper.properties', 'pin/injector/gradle/wrapper/gradle-wrapper.properties', 'pin/**/*.gradle', 'pin/**/*.gradle.kts') }}-
            pin-unit-v3-${{ runner.os }}-${{ runner.arch }}-1.91.1-
      - name: install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libprotobuf-dev protobuf-compiler
      - name: formatting
        run: cargo fmt --check --manifest-path pin/runtime/core/Cargo.toml
      - name: focused component checks
        run: cargo test --locked --manifest-path pin/runtime/core/Cargo.toml
      - name: bridge checks
        run: cargo test --locked --manifest-path pin/bridge/Cargo.toml
      - name: Android contract checks
        working-directory: pin
        run: |
          ./gradlew --no-daemon \
            --project-cache-dir "$RUNNER_TEMP/pin-gradle-project-cache" \
            :contracts:stock-aibus:testDebugUnitTest \
            :contracts:penumbra-ipc:testDebugUnitTest
          ./injector/gradlew --no-daemon \
            --project-cache-dir "$RUNNER_TEMP/pin-injector-gradle-project-cache" \
            -p injector :common:testDebugUnitTest
      - name: save Pin runtime Cargo downloads and target state
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pin-runtime-rust-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/pin-runtime-cargo-home/registry
            ${{ runner.temp }}/pin-runtime-cargo-home/git
            ${{ runner.temp }}/pin-runtime-cargo-target
            ${{ runner.temp }}/pin-gradle-home/caches
            ${{ runner.temp }}/pin-gradle-home/wrapper
          key: pin-unit-v3-${{ runner.os }}-${{ runner.arch }}-1.91.1-${{ hashFiles('pin/runtime/core/Cargo.lock', 'pin/bridge/Cargo.lock', 'rust-toolchain.toml', 'pin/gradle/wrapper/gradle-wrapper.properties', 'pin/injector/gradle/wrapper/gradle-wrapper.properties', 'pin/**/*.gradle', 'pin/**/*.gradle.kts') }}-${{ github.sha }}

  pin-builder-linux-amd64:
    name: Pin unit and debug artifact checks (Linux/x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require Linux/x64
        run: |
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Restore Pin build cache
        id: pin-builder-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pin-builder-data/build/pin-builder-cache
          key: pin-builder-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/containers/pin-builder/Dockerfile', 'platform/containers/pin-builder/entrypoint.sh', 'pin/gradle/wrapper/gradle-wrapper.properties', 'pin/injector/gradle/wrapper/gradle-wrapper.properties', 'pin/**/*.gradle', 'pin/**/*.gradle.kts', 'pin/**/Cargo.lock') }}
          restore-keys: |
            pin-builder-v4-${{ runner.os }}-${{ runner.arch }}-
      - name: Build all debug APKs
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/pin-builder-data"
          build="$data/build"
          REVIVAL_DATA_DIR="$data" REVIVAL_BUILD_DIR="$build" \
            node ./revival pin build-debug \
              --role installer --role bootstrap --role hook --role server --role hook-injector
      - name: Verify debug APK checksums
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pin-builder-data/build/pin-debug-builder-state/artifacts/device-debug"
          test "$(find "$root" -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 5
          (cd "$root" && sha256sum --check SHA256SUMS)
      - name: Save Pin build cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pin-builder-deps.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/pin-builder-data/build/pin-builder-cache
          key: pin-builder-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/containers/pin-builder/Dockerfile', 'platform/containers/pin-builder/entrypoint.sh', 'pin/gradle/wrapper/gradle-wrapper.properties', 'pin/injector/gradle/wrapper/gradle-wrapper.properties', 'pin/**/*.gradle', 'pin/**/*.gradle.kts', 'pin/**/Cargo.lock') }}
