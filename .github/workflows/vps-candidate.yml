name: Attested VPS candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attested-vps-candidate-main
  cancel-in-progress: false

jobs:
  build-attest-handoff:
    if: github.repository == 'TheAndersMadsen/ai-pin-revival' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REVIVAL_VPS_HANDOFF_ROOT: ${{ runner.temp }}/vps-candidate-handoff
    steps:
      - name: Check out the exact attested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Provision exact Rust
        uses: dtolnay/rust-toolchain@38ae5351029910ad7674ccfad89c37cbd636f3c4 # 1.91.1
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - name: Bind Node tools to candidate policy paths
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/opt/hostedtoolcache/node/22.14.0/x64/bin:/usr/bin:/bin
          test "$(/opt/hostedtoolcache/node/22.14.0/x64/bin/node --version)" = "v22.14.0"
          /usr/bin/sudo /usr/bin/install -m 0555 \
            /opt/hostedtoolcache/node/22.14.0/x64/bin/node /usr/bin/node
          /usr/bin/sudo /usr/bin/install -m 0555 \
            /opt/hostedtoolcache/node/22.14.0/x64/bin/node /usr/local/bin/node
          /usr/bin/sudo /usr/bin/ln -sfn \
            /opt/hostedtoolcache/node/22.14.0/x64/lib/node_modules/npm/bin/npm-cli.js /usr/bin/npm
          /usr/bin/sudo /usr/bin/ln -sfn \
            /opt/hostedtoolcache/node/22.14.0/x64/bin/npm /usr/local/bin/npm
          test "$(/usr/bin/node --version)" = "v22.14.0"
          test "$(/usr/bin/npm --version)" = "10.9.2"
          test "$(/usr/local/bin/node --version)" = "v22.14.0"
          test "$(/usr/local/bin/npm --version)" = "10.9.2"

      - name: Require the fixed candidate lane
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/usr/bin:/bin
          test "${GITHUB_REPOSITORY}" = "TheAndersMadsen/ai-pin-revival"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
          test "$(/usr/bin/uname -m)" = "x86_64"

      - name: Build the immutable candidate from the exact commit
        id: candidate
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          umask 077
          /usr/local/bin/node platform/deploy/release-candidate.mjs prepare \
            --commit "${GITHUB_SHA}" \
            --data-dir "${REVIVAL_VPS_HANDOFF_ROOT}" \
            --hosted-workflow \
            --json > "${RUNNER_TEMP}/vps-candidate-result.json"
          candidate_id=$(/usr/local/bin/node -e \
            'const fs=require("node:fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!/^[0-9a-f]{64}$/.test(x.candidateId))process.exit(1);process.stdout.write(x.candidateId)' \
            "${RUNNER_TEMP}/vps-candidate-result.json")
          printf 'candidate_id=%s\n' "${candidate_id}" >> "${GITHUB_OUTPUT}"
          printf 'candidate_path=%s\n' \
            "${REVIVAL_VPS_HANDOFF_ROOT}/release-candidates/${candidate_id}" >> "${GITHUB_OUTPUT}"

      - name: Create the exact source/toolchain/image handoff receipt
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/usr/local/bin:/usr/bin:/bin
          run_uri="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          /usr/local/bin/node platform/deploy/hosted-vps-candidate.mjs prepare-handoff \
            --candidate "${{ steps.candidate.outputs.candidate_path }}" \
            --output-root "${REVIVAL_VPS_HANDOFF_ROOT}" \
            --source-digest "${GITHUB_SHA}" \
            --run-uri "${run_uri}" \
            --json

      - name: Provider-sign the exact candidate file set and receipt
        id: candidate_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/vps-candidate-handoff/candidate-checksums.txt
          predicate-type: https://github.com/TheAndersMadsen/ai-pin-revival/attestations/vps-candidate/v1
          predicate-path: ${{ runner.temp }}/vps-candidate-handoff/hosted-vps-receipt.json

      - name: Seal the provider bundle at its handoff path
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          export PATH=/usr/bin:/bin
          /usr/bin/install -m 0600 "${{ steps.candidate_attest.outputs.bundle-path }}" \
            "${REVIVAL_VPS_HANDOFF_ROOT}/provider.sigstore.json"

      - name: Upload the file-only candidate handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vps-candidate-${{ github.sha }}
          path: |
            ${{ steps.candidate.outputs.candidate_path }}
            ${{ runner.temp }}/vps-candidate-handoff/hosted-vps-receipt.json
            ${{ runner.temp }}/vps-candidate-handoff/provider.sigstore.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
